# Render Blueprint for the Poker Group TEST site (free plan only).
# Secrets are never stored here: SESSION_SECRET is generated by Render, SETUP_TOKEN is
# entered once when the Blueprint is applied, and DATABASE_URL comes from the database.
services:
  - type: web
    name: poker-group
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: America/Phoenix
      - key: RUN_JOBS
        value: "0"
      - key: SETUP_TOKEN_TTL_HOURS
        value: "168"
      - key: SESSION_SECRET
        generateValue: true
      - key: SETUP_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: poker-group-db
          property: connectionString

databases:
  - name: poker-group-db
    plan: free
    region: oregon
    postgresMajorVersion: "17"
    databaseName: poker_group_db
    user: poker_group_db_user
    ipAllowList: []
